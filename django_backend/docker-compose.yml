services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: attend_ai
      POSTGRES_USER: attend
      POSTGRES_PASSWORD: attend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A hrms_project worker -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - web
      - redis

  celery-beat:
    build: .
    command: celery -A hrms_project beat -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - web
      - redis

volumes:
  postgres_data:
