services:
  - type: web
    name: attend-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py createsuperuser --noinput --username admin --email admin@example.com || echo "Superuser may already exist"
    startCommand: gunicorn hrms_project.wsgi:application --workers 3 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: attend-ai-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-taupe-seven-wvh8eejz3v.vercel.app
      - key: CORS_ALLOW_ALL_ORIGINS
        value: True
      # IMPORTANT: previously this used `generateValue: true`, which makes Render
      # create a random password you never see - login with admin/admin1234 (as
      # documented in README.md) would then fail on every fresh deploy because
      # that password would not match. Set it explicitly instead, and change it
      # after first login for a real production environment.
      - key: DJANGO_SUPERUSER_PASSWORD
        value: admin1234

databases:
  - name: attend-ai-db
    databaseName: attend_ai
    user: attend_ai_user
