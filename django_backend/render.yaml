services:
  - type: web
    name: attend-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn hrms_project.wsgi:application --workers 3 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: attend-ai-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: True

databases:
  - name: attend-ai-db
    databaseName: attend_ai
    user: attend_ai_user
